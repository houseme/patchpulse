# Apache-2.0. Hub mode polls configured agents and does not run local collectors.
mode = "hub"

[server]
bind = "127.0.0.1:9101"
request_timeout_secs = 15

[hub]
interval_secs = 60
request_timeout_secs = 10
stale_after_secs = 180
max_concurrency = 4
max_response_bytes = 8388608
max_total_snapshot_bytes = 67108864

[[hub.agents]]
id = "local-agent"
url = "http://127.0.0.1:9100/"
# For an authenticated HTTPS proxy, use a protected environment variable:
# bearer_token_env = "PATCHPULSE_AGENT_TOKEN"

[baseline]
enabled = false
name = "monthly"
required_kbs = []
