# Apache-2.0. Relative script paths resolve against this file's directory.
[server]
bind = "127.0.0.1:9100"
request_timeout_secs = 15

[collector]
interval_secs = 1800
collector_timeout_secs = 180
enable_wmi_installed = true
enable_wua_installed = true
enable_wua_pending = true
enable_powershell_installed = false
enable_powershell_pending = false
# Omit powershell_script to use the trusted embedded script.
# powershell_script = "../scripts/query-patches.ps1"

[cache]
stale_after_secs = 7200

[observability]
log_level = "info"
log_format = "json"
metrics_enabled = true
# Set a writable log file for SCM mode, which has no console.
# log_file = "C:/PatchPulse/logs/patchpulse.jsonl"

[observability.traces]
enabled = false
endpoint = "http://127.0.0.1:4318/v1/traces"
service_name = "patchpulse"
sample_ratio = 0.1
max_queue_size = 1024
export_timeout_secs = 2

[baseline]
enabled = false
name = "monthly"
required_kbs = []
# Set enabled=true and list exact required KBs, for example ["KB5034441"].
