name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      live_windows:
        description: Run read-only Windows collector integration tests
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy --component rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all-features --locked
      - run: cargo doc --no-deps --locked
      - name: Run opt-in live Windows collectors
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch' && inputs.live_windows
        run: cargo test --locked --test windows_collectors -- --ignored --nocapture
      - name: Parse deployment scripts
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.98.1 --profile minimal
      - run: cargo install cargo-deny --locked
      - run: cargo install cargo-audit --locked
      - run: cargo deny check
      - run: cargo audit
      - run: python3 scripts/dependency-policy.py
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t patchpulse:ci .
      - name: Verify unsupported platform remains observable
        run: python3 scripts/smoke-docker.py --image patchpulse:ci
